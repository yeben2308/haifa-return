<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  /* כרטיס תצוגה מקדימה לווטסאפ (1200×630) — באותו עולם של הדשבורד: פס כתום, שלט שחור, סרגל כיסוי */
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: 'Heebo', sans-serif; background: #f3f2ee; color: #141414; }
  .band { height: 150px; background: #f07a1a; display: flex; align-items: center; gap: 22px; padding: 0 64px; }
  .band img { height: 96px; }
  .band .t1 { font-weight: 900; font-size: 40px; line-height: 1; }
  .band .t2 { font-weight: 500; font-size: 26px; color: #3a1c00; margin-top: 6px; }
  .main { padding: 46px 64px 0; }
  h1 { font-size: 78px; font-weight: 900; letter-spacing: -.02em; line-height: 1; }
  .sub { font-size: 30px; font-weight: 500; color: #3d3c39; margin-top: 16px; }
  .sign { position: absolute; bottom: 56px; right: 64px; left: 64px; display: flex; align-items: center; gap: 22px; }
  .plate { background: #161616; color: #f6f5f1; font-weight: 800; font-size: 26px; padding: 14px 22px; border-radius: 4px; display: flex; align-items: center; gap: 12px; white-space: nowrap; }
  .plate svg { width: 30px; height: 30px; stroke: #f07a1a; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .gauge { position: relative; flex: 1; height: 26px; background: #e3e1da; border-radius: 3px; overflow: hidden; }
  .seg { position: absolute; top: 0; bottom: 0; }
  .door { position: absolute; top: -6px; bottom: -6px; left: 0; width: 6px; background: #161616; }
</style>
</head>
<body>
  <div class="band">
    <img src="emblem.png" alt="">
    <div><div class="t1">משרד החינוך</div><div class="t2">מחוז חיפה</div></div>
  </div>
  <div class="main">
    <h1>מיגון מוסדות חינוך</h1>
    <div class="sub">כיסוי מרחבים מוגנים בכל מוסדות המחוז · הנחיות פיקוד העורף לכל ישוב</div>
  </div>
  <div class="sign">
    <div class="plate"><svg viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6"/></svg>כניסה למורשים</div>
    <div class="gauge">
      <div class="seg" style="right:0;width:12%;background:#a3121b"></div>
      <div class="seg" style="right:12%;width:8%;background:#dc4a1f"></div>
      <div class="seg" style="right:20%;width:14%;background:#e3a019"></div>
      <div class="seg" style="right:34%;width:38%;background:#74a33a"></div>
      <div class="seg" style="right:72%;width:28%;background:#23743a"></div>
      <div class="door"></div>
    </div>
  </div>
</body>
</html>
